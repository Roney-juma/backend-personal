name: Deploy to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: SSH & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/backend-personal
            git reset --hard
            git clean -df
            git pull origin production
            # Deterministic install from the committed lockfile (installs new deps
            # like prom-client). Falls back to npm install if the lockfile is stale.
            npm ci --omit=dev || npm install --omit=dev
            # Restart BOTH the web app and the background worker so worker-side
            # changes (e.g. its metrics server) actually take effect.
            pm2 restart app worker
