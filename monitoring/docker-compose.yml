# Monitoring stack for the AVE backend — Prometheus + Grafana + node_exporter.
#
# Runs on the SAME EC2 box as the app. Everything uses host networking and binds
# to 127.0.0.1 only, so nothing is exposed to the internet — you reach Grafana and
# Prometheus over an SSH tunnel (see monitoring/README.md). Do NOT open ports
# 3300/9090/9100/9464 in the EC2 security group.
#
#   cd monitoring && GRAFANA_ADMIN_PASSWORD=yourpass docker compose up -d

services:
  # Host CPU / memory / disk / network metrics.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ave-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=127.0.0.1:9100'
    volumes:
      - '/:/host:ro,rslave'

  prometheus:
    image: prom/prometheus:latest
    container_name: ave-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'          # cap disk use on the small box
      - '--web.listen-address=127.0.0.1:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: ave-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3300                       # 3000 is taken by the app
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
